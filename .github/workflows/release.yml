name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Release Signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Release APK
        run: ./gradlew assembleFlossOsmRelease
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/keystore/release.jks
          KEYSTORE_PASSWORD: cashledger123
          KEY_ALIAS: cashledger
          KEY_PASSWORD: cashledger123

      - name: Prepare Release Artifacts
        env:
          TAG_NAME: ${{ github.event.inputs.tag_name || github.ref_name }}
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/flossOsm/release/*.apk "release-artifacts/CashLedger-${TAG_NAME}.apk"
          cd release-artifacts
          sha256sum "CashLedger-${TAG_NAME}.apk" > "CashLedger-${TAG_NAME}.apk.sha256"
          cd ..

      - name: Create Release Notes
        env:
          TAG_NAME: ${{ github.event.inputs.tag_name || github.ref_name }}
        run: |
          cat << EOF > RELEASE_NOTES.md
          ## 💰 Cash Ledger ${TAG_NAME} Release

          Official signed release of **Cash Ledger** — a private, offline-first expense and budget manager for Android.

          ### 🌟 What's New & Highlights:
          - **Android 15 Base Compatibility**: Upgraded platform base to Android 15 (minSdk 35 & targetSdk 35).
          - **Universal Edge-to-Edge**: Modern edge-to-edge layout, transparent system bars, and dynamic status bar scrim across all screens.
          - **Safe Area Inset Handling**: Applied system bar and cutout insets to prevent toolbars, navigation items, and floating action buttons from overlapping system UI.
          - **Adaptive System Bar Icons**: Contrast-aware light and dark icon coloring matching current theme.
          - **Multi-Wallet & Budgeting**: Manage multiple accounts, custom categories, smart budgets, and recurring transactions.
          - **Multi-Currency & Portability**: Multi-currency support, CSV import/export, Excel/PDF export, and automated WebDAV backup.
          - **100% Offline & Private**: Zero accounts, zero tracking, and biometric app lock.

          ### 📦 Installation:
          Download and install \`CashLedger-${TAG_NAME}.apk\` below. Verify integrity with \`CashLedger-${TAG_NAME}.apk.sha256\`.
          EOF

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.inputs.tag_name || github.ref_name }}
        run: |
          gh release create "$TAG_NAME" \
            --title "Cash Ledger $TAG_NAME" \
            --notes-file RELEASE_NOTES.md \
            "release-artifacts/CashLedger-${TAG_NAME}.apk" \
            "release-artifacts/CashLedger-${TAG_NAME}.apk.sha256"
